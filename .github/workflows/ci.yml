name: CI

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  byggsteg:
    name: 🧱 Byggsteg
    uses: jjba23/byggsteg-github/.github/workflows/byggsteg.yml@trunk
    with:
      tasks: maak-test maak-emacs-test maak-web-deploy
      poll-limit: "1024"
    secrets: inherit
